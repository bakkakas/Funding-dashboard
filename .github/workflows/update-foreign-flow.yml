name: Update foreign flow data
on:
  schedule:
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python3 update_foreign_flow.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foreign_flow_data.json
          git diff --cached --quiet || git commit -m "chore: update foreign flow data"
          git push
