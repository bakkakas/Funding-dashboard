name: Update credit balances
on:
  schedule:
    - cron: '17 11 * * *' # 20:17 KST; KOFIA daily publication, not intraday
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-credit-balances
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python3 scripts/update_credit_balance.py
      - name: Save verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add credit_balance_data.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update credit balances"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push && exit 0
          done
          exit 1
