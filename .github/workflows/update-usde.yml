name: Update USDe market cap

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: update-usde-market-cap
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  update-usde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect USD market cap history
        run: python3 scripts/update_usde_market_cap.py
      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usde-market-cap.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update USDe market cap"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      # GITHUB_TOKEN pushes do not automatically trigger a Pages rebuild.
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
