name: Update sUSDe yield data

on:
  # Active schedule: local model-free LaunchAgent, every 6h while host is available.
  # GitHub-hosted requests are redirected by Ethena to /restricted.
  workflow_dispatch:

concurrency:
  group: update-susde-yield
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  update-susde-yield:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect and reconcile official sUSDe APY
        run: python3 scripts/update_susde_yield.py
      - name: Publish snapshot
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/susde-yield.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update sUSDe yield data"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Request Pages build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
