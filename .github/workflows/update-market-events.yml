name: Update market event calendar
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-market-events
  cancel-in-progress: false
jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r scripts/requirements-market-events.txt
      - run: python scripts/update_market_events.py
      - name: Publish verified calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_events.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh market event calendar"
          git pull --rebase origin main
          git push origin HEAD:main
