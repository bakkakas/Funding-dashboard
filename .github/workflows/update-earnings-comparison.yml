name: Update public earnings comparisons
on:
  schedule:
    - cron: '10 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: update-earnings-comparison
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - id: collect
        continue-on-error: true
        run: python3 scripts/update_earnings_comparison.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings-comparison
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh public earnings comparisons"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
      - name: Report partial source failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
