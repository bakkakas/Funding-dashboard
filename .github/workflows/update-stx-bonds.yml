name: Update STX bond data

on:
  schedule:
    - cron: '37 */4 * * *'
  workflow_dispatch:

concurrency:
  group: update-stx-bonds
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  update-stx-bonds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect Hiro bond snapshot
        run: python3 scripts/update_stx_bonds.py
      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stx-bonds.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update STX bond data"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
