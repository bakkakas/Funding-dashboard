<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hyperliquid XYZ Funding Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101112;
      --panel: #181b1f;
      --panel-2: #20242a;
      --line: #303741;
      --text: #eef1f4;
      --muted: #9ea8b3;
      --soft: #cfd6de;
      --red: #ff6b6b;
      --green: #3ed598;
      --amber: #f5b85b;
      --blue: #64a8ff;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.24);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 220px), var(--bg);
      color: var(--text);
    }
    button { font: inherit; cursor: pointer; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(16,17,18,.9);
      backdrop-filter: blur(14px);
    }
    .topbar-inner, .content {
      width: min(1440px, calc(100vw - 32px));
      margin: 0 auto;
    }
    .topbar-inner {
      min-height: 76px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
    }
    h1 { margin: 0; font-size: clamp(22px, 2.4vw, 34px); line-height: 1.08; letter-spacing: 0; }
    .brand p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
    .segmented, .pair-switcher {
      display: inline-flex;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }
    .segment, .pair-pill, .icon-btn {
      min-height: 34px;
      border: 0;
      color: var(--muted);
      background: transparent;
      border-radius: 6px;
      padding: 0 12px;
      transition: background .16s ease, color .16s ease, transform .16s ease;
    }
    .segment.active, .pair-pill.active { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px rgba(255,255,255,.04); }
    .icon-btn { width: 38px; padding: 0; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel); color: var(--soft); font-size: 18px; }
    .icon-btn:hover, .segment:hover, .pair-pill:hover { color: var(--text); background: #252a31; }
    .content { padding: 22px 0 32px; }
    .status-row { min-height: 24px; display: flex; align-items: center; justify-content: space-between; gap: 14px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .status-row strong { color: var(--soft); font-weight: 600; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
    .metric-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      min-height: 176px;
      padding: 16px;
      display: grid;
      gap: 16px;
      align-content: space-between;
    }
    .metric-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .coin-title { display: flex; gap: 10px; align-items: center; min-width: 0; }
    .swatch { width: 10px; height: 34px; border-radius: 3px; flex: 0 0 auto; }
    .coin-title h2 { margin: 0; font-size: 18px; line-height: 1.1; letter-spacing: 0; }
    .coin-title span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }
    .mark { color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .annualized { font-size: clamp(26px, 3.2vw, 44px); line-height: 1; font-weight: 760; letter-spacing: 0; font-variant-numeric: tabular-nums; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .flat { color: var(--soft); }
    .metric-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .mini-metric { border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
    .mini-metric label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .mini-metric div { color: var(--soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .main-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(330px, .75fr); gap: 14px; align-items: start; }
    .section { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
    .section-head { min-height: 60px; padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .section-head h3 { margin: 0; font-size: 15px; letter-spacing: 0; }
    .section-head span { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .chart-wrap { min-height: 430px; padding: 10px 14px 14px; }
    svg.chart { width: 100%; height: 390px; display: block; }
    .axis-text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .grid-line { stroke: rgba(255,255,255,.08); stroke-width: 1; }
    .zero-line { stroke: rgba(255,255,255,.26); stroke-width: 1.2; stroke-dasharray: 5 6; }
    .chart-line { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
    .chart-dot { stroke: var(--panel); stroke-width: 2; }
    .empty-state { min-height: 390px; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
    .table-wrap { overflow: auto; max-height: 430px; }
    table { width: 100%; border-collapse: collapse; min-width: 620px; font-size: 13px; }
    th, td { text-align: right; padding: 11px 12px; border-bottom: 1px solid rgba(255,255,255,.06); font-variant-numeric: tabular-nums; white-space: nowrap; }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
    th { position: sticky; top: 0; z-index: 1; background: var(--panel); color: var(--muted); font-size: 11px; font-weight: 600; }
    td { color: var(--soft); }
    tr:hover td { background: rgba(255,255,255,.025); }
    .right-stack { display: grid; gap: 14px; }
    .insight-list { padding: 14px 16px 16px; display: grid; gap: 12px; }
    .insight { display: grid; grid-template-columns: 1fr auto; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.07); padding-bottom: 12px; min-height: 58px; align-items: center; }
    .insight:last-child { border-bottom: 0; padding-bottom: 0; }
    .insight b { display: block; font-size: 13px; margin-bottom: 4px; }
    .insight span { color: var(--muted); font-size: 12px; }
    .insight strong { font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .error { border-color: rgba(255,107,107,.4); color: #ffd0d0; }
    @media (max-width: 1120px) { .summary-grid, .main-grid { grid-template-columns: 1fr; } .metric-card { min-height: 150px; } }
    @media (max-width: 820px) {
      .topbar-inner { grid-template-columns: 1fr; padding: 14px 0; }
      .toolbar { justify-content: flex-start; }
      .content, .topbar-inner { width: min(100vw - 20px, 1440px); }
      .status-row { align-items: flex-start; flex-direction: column; }
      .metric-strip { grid-template-columns: 1fr; }
      .pair-switcher { width: 100%; overflow-x: auto; }
    }
    @media (max-width: 560px) { .segmented { width: 100%; } .segment { flex: 1; padding: 0 8px; } .toolbar { display: grid; grid-template-columns: 1fr 38px; width: 100%; } .toolbar .segmented:nth-child(2) { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <h1>Hyperliquid XYZ Funding</h1>
          <p>Funding rates, history, and annualized views for GOOGL, Samsung, and SK Hynix.</p>
        </div>
        <div class="toolbar" aria-label="Dashboard settings">
          <div class="segmented" id="rangeControl" aria-label="Range">
            <button class="segment active" data-range="1">24H</button>
            <button class="segment" data-range="7">7D</button>
            <button class="segment" data-range="30">30D</button>
            <button class="segment" data-range="90">90D</button>
          </div>
          <div class="segmented" id="annualControl" aria-label="Annualization mode">
            <button class="segment active" data-mode="simple">Simple</button>
            <button class="segment" data-mode="compound">Compound</button>
          </div>
          <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">R</button>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="status-row">
        <div id="statusText">Preparing data</div>
        <div id="lastUpdated"></div>
      </div>
      <section class="summary-grid" id="summaryGrid" aria-label="Current funding summary"></section>
      <section class="main-grid">
        <div class="section">
          <div class="section-head">
            <h3>Annualized Funding</h3>
            <div class="pair-switcher" id="pairControl" aria-label="Chart pair">
              <button class="pair-pill active" data-coin="all">ALL</button>
              <button class="pair-pill" data-coin="xyz:GOOGL">GOOGL</button>
              <button class="pair-pill" data-coin="xyz:SMSN">Samsung</button>
              <button class="pair-pill" data-coin="xyz:SKHX">SK Hynix</button>
            </div>
          </div>
          <div class="chart-wrap" id="chartWrap"></div>
        </div>
        <div class="right-stack">
          <div class="section">
            <div class="section-head"><h3>Funding Rank</h3><span id="rankPeriod">24H</span></div>
            <div class="insight-list" id="rankList"></div>
          </div>
          <div class="section">
            <div class="section-head"><h3>Current Market</h3><span>XYZ DEX</span></div>
            <div class="insight-list" id="marketList"></div>
          </div>
        </div>
      </section>
      <section class="section" style="margin-top:14px">
        <div class="section-head"><h3>Funding History</h3><span id="rowCount"></span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Time</th><th>Pair</th><th>Funding</th><th>Annualized</th><th>Premium</th></tr></thead>
            <tbody id="historyRows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_URL = "https://api.hyperliquid.xyz/info";
    const HOURS_PER_YEAR = 24 * 365;
    const MAX_PAGES = 12;
    const COINS = [
      { coin: "xyz:GOOGL", label: "GOOGL", urlLabel: "xyz:GOOGL", color: "#64a8ff" },
      { coin: "xyz:SMSN", label: "Samsung", urlLabel: "xyz:SAMSUNG", color: "#3ed598" },
      { coin: "xyz:SKHX", label: "SK Hynix", urlLabel: "xyz:SKHYNIX", color: "#f5b85b" }
    ];
    const state = { rangeDays: 1, annualMode: "simple", selectedCoin: "all", loading: false, usingLatestWindow: false, dataWindowEnd: null, current: new Map(), history: new Map(), errors: [] };
    const els = {
      statusText: document.getElementById("statusText"), lastUpdated: document.getElementById("lastUpdated"), summaryGrid: document.getElementById("summaryGrid"), chartWrap: document.getElementById("chartWrap"), rankList: document.getElementById("rankList"), marketList: document.getElementById("marketList"), historyRows: document.getElementById("historyRows"), rowCount: document.getElementById("rowCount"), rankPeriod: document.getElementById("rankPeriod"), refreshBtn: document.getElementById("refreshBtn")
    };
    function formatPercent(value, digits = 2) { if (!Number.isFinite(value)) return "-"; const sign = value > 0 ? "+" : ""; return `${sign}${value.toLocaleString("en-US", { maximumFractionDigits: digits, minimumFractionDigits: digits })}%`; }
    function formatRate(value) { if (!Number.isFinite(value)) return "-"; return `${(value * 100).toLocaleString("en-US", { maximumFractionDigits: 5, minimumFractionDigits: 5 })}%`; }
    function formatNumber(value, digits = 2) { if (!Number.isFinite(value)) return "-"; return value.toLocaleString("en-US", { maximumFractionDigits: digits }); }
    function formatTime(ms, includeDate = true) { if (!Number.isFinite(ms)) return "-"; return new Intl.DateTimeFormat("en-US", { month: includeDate ? "2-digit" : undefined, day: includeDate ? "2-digit" : undefined, hour: "2-digit", minute: "2-digit" }).format(new Date(ms)); }
    function annualize(rate) { if (!Number.isFinite(rate)) return NaN; if (state.annualMode === "compound" && rate > -1) return (Math.pow(1 + rate, HOURS_PER_YEAR) - 1) * 100; return rate * HOURS_PER_YEAR * 100; }
    function toneClass(value) { if (!Number.isFinite(value) || Math.abs(value) < .000001) return "flat"; return value > 0 ? "positive" : "negative"; }
    async function postInfo(body) { const response = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); }
    async function fetchCurrent() {
      const response = await postInfo({ type: "metaAndAssetCtxs", dex: "xyz" });
      const universe = response[0]?.universe || []; const ctxs = response[1] || []; const wanted = new Set(COINS.map(item => item.coin)); const current = new Map();
      universe.forEach((asset, index) => { if (!wanted.has(asset.name)) return; const ctx = ctxs[index] || {}; current.set(asset.name, { markPx: Number(ctx.markPx), funding: Number(ctx.funding), openInterest: Number(ctx.openInterest), premium: Number(ctx.premium), maxLeverage: asset.maxLeverage }); });
      return current;
    }
    async function fetchFundingHistory(coin, startTime, endTime) {
      const rows = []; let cursor = startTime;
      for (let page = 0; page < MAX_PAGES; page += 1) {
        const batch = await postInfo({ type: "fundingHistory", coin, startTime: cursor, endTime });
        if (!Array.isArray(batch) || batch.length === 0) break;
        for (const row of batch) { const time = Number(row.time); if (time >= startTime && time <= endTime) rows.push({ coin: row.coin, time, fundingRate: Number(row.fundingRate), premium: Number(row.premium) }); }
        const lastTime = Number(batch[batch.length - 1]?.time); if (!Number.isFinite(lastTime) || batch.length < 500 || lastTime >= endTime) break; cursor = lastTime + 1;
      }
      return rows.sort((a, b) => a.time - b.time);
    }
    function average(values) { const finite = values.filter(Number.isFinite); if (!finite.length) return NaN; return finite.reduce((sum, value) => sum + value, 0) / finite.length; }
    function latestRows() { return [...state.history.values()].flat().sort((a, b) => b.time - a.time); }
    function filterHistoryWindow(historyMap, endTime) { const cutoff = endTime - state.rangeDays * 24 * 60 * 60 * 1000; return new Map(COINS.map(meta => [meta.coin, (historyMap.get(meta.coin) || []).filter(row => row.time >= cutoff && row.time <= endTime)])); }
    function coinMeta(coin) { return COINS.find(item => item.coin === coin); }
    function renderSummary() {
      els.summaryGrid.innerHTML = COINS.map(meta => {
        const current = state.current.get(meta.coin); const rows = state.history.get(meta.coin) || []; const latestRate = current?.funding ?? rows[rows.length - 1]?.fundingRate; const annual = annualize(latestRate); const avgAnnual = annualize(average(rows.map(row => row.fundingRate))); const latestHistory = rows[rows.length - 1];
        return `<article class="metric-card"><div class="metric-head"><div class="coin-title"><i class="swatch" style="background:${meta.color}"></i><div><h2>${meta.label}</h2><span>${meta.urlLabel}</span></div></div><div class="mark">$${formatNumber(current?.markPx, 4)}</div></div><div class="annualized ${toneClass(annual)}">${formatPercent(annual)}</div><div class="metric-strip"><div class="mini-metric"><label>Current funding</label><div>${formatRate(latestRate)}</div></div><div class="mini-metric"><label>Period average</label><div class="${toneClass(avgAnnual)}">${formatPercent(avgAnnual)}</div></div><div class="mini-metric"><label>Latest record</label><div>${latestHistory ? formatTime(latestHistory.time) : "-"}</div></div></div></article>`;
      }).join("");
    }
    function makeChartData() { const selected = state.selectedCoin === "all" ? COINS : COINS.filter(item => item.coin === state.selectedCoin); return selected.map(meta => ({ ...meta, rows: (state.history.get(meta.coin) || []).map(row => ({ time: row.time, value: annualize(row.fundingRate) })).filter(row => Number.isFinite(row.value)) })).filter(series => series.rows.length); }
    function renderChart() {
      const series = makeChartData(); if (!series.length) { els.chartWrap.innerHTML = `<div class="empty-state">No funding history available for this window.</div>`; return; }
      const width = 960, height = 390, margin = { top: 22, right: 56, bottom: 34, left: 60 }; const plotW = width - margin.left - margin.right, plotH = height - margin.top - margin.bottom; const allPoints = series.flatMap(item => item.rows); const minTime = Math.min(...allPoints.map(point => point.time)); const maxTime = Math.max(...allPoints.map(point => point.time)); let minY = Math.min(...allPoints.map(point => point.value)); let maxY = Math.max(...allPoints.map(point => point.value));
      if (minY === maxY) { minY -= 1; maxY += 1; }
      const pad = Math.max((maxY - minY) * .12, .5); minY -= pad; maxY += pad;
      const x = time => margin.left + ((time - minTime) / Math.max(maxTime - minTime, 1)) * plotW; const y = value => margin.top + (1 - ((value - minY) / (maxY - minY))) * plotH;
      const grid = Array.from({ length: 6 }, (_, index) => minY + ((maxY - minY) / 5) * index); const timeTicks = Array.from({ length: 4 }, (_, index) => minTime + ((maxTime - minTime) / 3) * index);
      const lines = series.map(item => { const d = item.rows.map((point, index) => `${index === 0 ? "M" : "L"} ${x(point.time).toFixed(2)} ${y(point.value).toFixed(2)}`).join(" "); const last = item.rows[item.rows.length - 1]; return `<path class="chart-line" d="${d}" stroke="${item.color}"></path><circle class="chart-dot" cx="${x(last.time).toFixed(2)}" cy="${y(last.value).toFixed(2)}" r="4" fill="${item.color}"></circle><text class="axis-text" x="${Math.min(x(last.time) + 8, width - 80).toFixed(2)}" y="${y(last.value).toFixed(2)}" dominant-baseline="middle">${item.label}</text>`; }).join("");
      const zeroY = y(0); const zeroLine = zeroY >= margin.top && zeroY <= height - margin.bottom ? `<line class="zero-line" x1="${margin.left}" x2="${width - margin.right}" y1="${zeroY.toFixed(2)}" y2="${zeroY.toFixed(2)}"></line>` : "";
      els.chartWrap.innerHTML = `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Annualized funding chart">${grid.map(tick => { const gy = y(tick); return `<line class="grid-line" x1="${margin.left}" x2="${width - margin.right}" y1="${gy.toFixed(2)}" y2="${gy.toFixed(2)}"></line><text class="axis-text" x="${margin.left - 10}" y="${gy.toFixed(2)}" text-anchor="end" dominant-baseline="middle">${formatPercent(tick, 0)}</text>`; }).join("")}${timeTicks.map(tick => `<text class="axis-text" x="${x(tick).toFixed(2)}" y="${height - 10}" text-anchor="middle">${formatTime(tick, state.rangeDays > 1)}</text>`).join("")}${zeroLine}${lines}</svg>`;
    }
    function renderRank() {
      const ranked = COINS.map(meta => { const rows = state.history.get(meta.coin) || []; const avgAnnual = annualize(average(rows.map(row => row.fundingRate))); return { ...meta, avgAnnual, count: rows.length }; }).sort((a, b) => (b.avgAnnual || -Infinity) - (a.avgAnnual || -Infinity));
      els.rankPeriod.textContent = state.rangeDays === 1 ? "24H" : `${state.rangeDays}D`; els.rankList.innerHTML = ranked.map((item, index) => `<div class="insight"><div><b>${index + 1}. ${item.label}</b><span>${item.count.toLocaleString("en-US")} records</span></div><strong class="${toneClass(item.avgAnnual)}">${formatPercent(item.avgAnnual)}</strong></div>`).join("");
    }
    function renderMarket() { els.marketList.innerHTML = COINS.map(meta => { const current = state.current.get(meta.coin); return `<div class="insight"><div><b>${meta.label}</b><span>OI ${formatNumber(current?.openInterest, 2)} / ${current?.maxLeverage || "-"}x</span></div><strong class="${toneClass(current?.premium)}">${formatRate(current?.premium)}</strong></div>`; }).join(""); }
    function renderTable() { const rows = latestRows().slice(0, 360); els.rowCount.textContent = `${latestRows().length.toLocaleString("en-US")} rows`; els.historyRows.innerHTML = rows.map(row => { const meta = coinMeta(row.coin); const annual = annualize(row.fundingRate); return `<tr><td>${formatTime(row.time)}</td><td>${meta?.label || row.coin}</td><td class="${toneClass(row.fundingRate)}">${formatRate(row.fundingRate)}</td><td class="${toneClass(annual)}">${formatPercent(annual)}</td><td class="${toneClass(row.premium)}">${formatRate(row.premium)}</td></tr>`; }).join(""); }
    function renderStatus() {
      if (state.loading) { els.statusText.innerHTML = "<strong>Updating</strong>"; return; }
      const totalRows = latestRows().length; if (state.errors.length) { els.statusText.innerHTML = `<strong class="error">${state.errors.length} request failures</strong> / ${totalRows.toLocaleString("en-US")} records loaded`; return; }
      const basis = state.usingLatestWindow && state.dataWindowEnd ? `latest available record: ${formatTime(state.dataWindowEnd)}` : "current-time window"; els.statusText.innerHTML = `<strong>${totalRows.toLocaleString("en-US")} records</strong> / ${basis} / Hyperliquid XYZ API`;
    }
    function renderAll() { renderSummary(); renderChart(); renderRank(); renderMarket(); renderTable(); renderStatus(); }
    async function loadDashboard() {
      state.loading = true; state.errors = []; state.usingLatestWindow = false; state.dataWindowEnd = null; els.refreshBtn.disabled = true; renderStatus();
      const endTime = Date.now(); const startTime = endTime - state.rangeDays * 24 * 60 * 60 * 1000;
      try {
        const [current, ...historyResults] = await Promise.all([fetchCurrent(), ...COINS.map(async meta => { try { return [meta.coin, await fetchFundingHistory(meta.coin, startTime, endTime)]; } catch (error) { state.errors.push(`${meta.coin}: ${error.message}`); return [meta.coin, []]; } })]);
        state.current = current; state.history = new Map(historyResults);
        if (latestRows().length === 0) {
          const fallbackDays = Math.max(240, state.rangeDays); const fallbackStart = endTime - fallbackDays * 24 * 60 * 60 * 1000;
          const fallbackResults = await Promise.all(COINS.map(async meta => { try { return [meta.coin, await fetchFundingHistory(meta.coin, fallbackStart, endTime)]; } catch (error) { state.errors.push(`${meta.coin}: ${error.message}`); return [meta.coin, []]; } }));
          const broadHistory = new Map(fallbackResults); const allFallbackRows = [...broadHistory.values()].flat(); const latestTime = Math.max(...allFallbackRows.map(row => row.time).filter(Number.isFinite));
          if (Number.isFinite(latestTime)) { state.usingLatestWindow = true; state.dataWindowEnd = latestTime; state.history = filterHistoryWindow(broadHistory, latestTime); }
        } else { const latestTime = Math.max(...latestRows().map(row => row.time)); state.dataWindowEnd = Number.isFinite(latestTime) ? latestTime : endTime; }
        els.lastUpdated.textContent = `Updated ${new Intl.DateTimeFormat("en-US", { hour: "2-digit", minute: "2-digit", second: "2-digit" }).format(new Date())}`;
      } catch (error) { state.errors.push(error.message); }
      finally { state.loading = false; els.refreshBtn.disabled = false; renderAll(); }
    }
    document.getElementById("rangeControl").addEventListener("click", event => { const button = event.target.closest("button[data-range]"); if (!button) return; state.rangeDays = Number(button.dataset.range); document.querySelectorAll("#rangeControl .segment").forEach(item => item.classList.toggle("active", item === button)); loadDashboard(); });
    document.getElementById("annualControl").addEventListener("click", event => { const button = event.target.closest("button[data-mode]"); if (!button) return; state.annualMode = button.dataset.mode; document.querySelectorAll("#annualControl .segment").forEach(item => item.classList.toggle("active", item === button)); renderAll(); });
    document.getElementById("pairControl").addEventListener("click", event => { const button = event.target.closest("button[data-coin]"); if (!button) return; state.selectedCoin = button.dataset.coin; document.querySelectorAll("#pairControl .pair-pill").forEach(item => item.classList.toggle("active", item === button)); renderChart(); });
    els.refreshBtn.addEventListener("click", loadDashboard);
    loadDashboard();
  </script>
</body>
</html>
