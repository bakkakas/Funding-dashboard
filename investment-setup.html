<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>투자 셋업</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <link rel="stylesheet" href="./styles.css?v=3">
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div><h1>투자 셋업</h1></div>
      <div class="header-actions">
        <button class="chip subtle" id="loginButton" type="button">로그인</button>
        <button class="chip subtle" id="signupButton" type="button">회원가입</button>
      </div>
    </div>
    <nav class="dashboard-nav">
      <a class="dashboard-nav-link" href="./">Funding</a>
      <a class="dashboard-nav-link" href="./foreign-flow.html">외국인 수급</a>
      <a class="dashboard-nav-link" href="./my-assets.html">내 자산</a>
      <a class="dashboard-nav-link active" href="./investment-setup.html">투자 셋업</a>
    </nav>
    <div class="card wide">
      <h3 class="section-title">준비 중</h3>
      <div class="note">내 자산 대시보드 완성 후 투자 계획과 목표 비중을 관리하는 화면이 추가될 예정이야.</div>
      <div class="mini" id="accountNotice" style="margin-top:14px">계정 확인 중…</div>
    </div>
  </div>
  <div class="modal-backdrop" id="authModal" aria-hidden="true">
    <div class="modal">
      <div class="modal-head">
        <h3 id="authModalTitle">로그인</h3>
        <button class="chip subtle" id="authCloseButton" type="button">닫기</button>
      </div>
      <form class="modal-grid" id="authForm">
        <button class="chip google-auth" id="authGoogleButton" type="button"><span class="google-mark" aria-hidden="true">G</span>Google로 계속하기</button>
        <div class="auth-divider"><span>또는</span></div>
        <input class="field" id="authEmail" type="email" autocomplete="email" placeholder="email@example.com">
        <input class="field" id="authPassword" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)">
        <button class="chip active" id="authSubmitButton" type="submit">로그인</button>
        <div class="auth-status" id="authStatus">모든 메뉴에서 같은 Supabase 계정을 사용해.</div>
      </form>
    </div>
  </div>
  <script type="module" src="./js/investment-setup.js?v=1"></script>
</body>
</html>
