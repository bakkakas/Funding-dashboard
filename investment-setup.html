<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>투자 셋업</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div><h1 data-page-i18n="heading">투자 셋업</h1></div>
      <div class="header-side">
        <div class="header-market-row">
          <div class="header-actions">
            <div class="language-toggle" aria-label="Language">
              <button class="chip subtle active" id="langKoButton" type="button" aria-label="한국어" title="한국어"><img class="flag-icon" alt="" src="https://flagcdn.com/w40/kr.png"><span class="language-code">KR</span></button>
              <button class="chip subtle" id="langEnButton" type="button" aria-label="English" title="English"><img class="flag-icon" alt="" src="https://flagcdn.com/w40/us.png"><span class="language-code">EN</span></button>
            </div>
            <button class="chip subtle" id="loginButton" type="button">로그인</button>
            <button class="chip subtle" id="signupButton" type="button">회원가입</button>
            <a class="chip subtle" id="adminLink" href="./admin.html" style="text-decoration:none">관리자</a>
          </div>
          <div class="fx-ticker warn" id="usdKrwTicker">USD/KRW 조회 중</div>
          <div class="stamp" id="updatedAt">Updated: -</div>
        </div>
      </div>
    </div>
    <nav class="dashboard-nav">
      <a class="dashboard-nav-link" href="./">Funding</a>
      <a class="dashboard-nav-link" href="./foreign-flow.html" data-page-i18n="navForeign">외국인 수급</a>
      <a class="dashboard-nav-link" href="./my-assets.html" data-page-i18n="navAssets">내 자산</a>
      <a class="dashboard-nav-link active" href="./investment-setup.html" data-page-i18n="navSetup">투자 셋업</a>
    </nav>
    <div class="card wide">
      <h3 class="section-title" data-page-i18n="comingSoon">준비 중</h3>
      <div class="note" data-page-i18n="comingSoonNote">내 자산 대시보드 완성 후 투자 계획과 목표 비중을 관리하는 화면이 추가될 예정이야.</div>
      <div class="mini" id="accountNotice" style="margin-top:14px">계정 확인 중…</div>
    </div>
  </div>
  <div class="modal-backdrop" id="authModal" aria-hidden="true">
    <div class="modal">
      <div class="modal-head">
        <h3 id="authModalTitle">로그인</h3>
        <button class="chip subtle" id="authCloseButton" type="button">닫기</button>
      </div>
      <form class="modal-grid" id="authForm">
        <button class="chip google-auth" id="authGoogleButton" type="button"><span class="google-mark" aria-hidden="true">G</span><span data-page-i18n="continueGoogle">Google로 계속하기</span></button>
        <div class="auth-divider"><span data-page-i18n="or">또는</span></div>
        <input class="field" id="authEmail" type="email" autocomplete="email" placeholder="email@example.com">
        <input class="field" id="authPassword" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)" data-page-i18n-placeholder="passwordPlaceholder">
        <button class="chip active" id="authSubmitButton" type="submit">로그인</button>
        <div class="auth-status" id="authStatus">모든 메뉴에서 같은 Supabase 계정을 사용해.</div>
      </form>
    </div>
  </div>
  <script type="module" src="./js/investment-setup.js?v=3"></script>
</body>
</html>
