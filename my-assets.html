<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 자산</title><link rel="icon" href="data:,"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./my-assets.css"></head><body><div class="wrap">
<div class="header"><div><h1>내 자산</h1><div class="mini">주식·크립토·원자재·현금을 한곳에서 관리해.</div></div><div class="header-actions"><button class="chip subtle" id="portfolioAuth">로그인</button><button class="chip active" id="addAsset" disabled>+ 자산 추가</button></div></div>
<nav class="dashboard-nav"><a class="dashboard-nav-link" href="./">Funding</a><a class="dashboard-nav-link" href="./foreign-flow.html">외국인 수급</a><a class="dashboard-nav-link active" href="./my-assets.html">내 자산</a><a class="dashboard-nav-link" href="./investment-setup.html">투자 셋업</a></nav>
<div id="portfolioGate" class="card portfolio-gate"><h2>로그인 후 포트폴리오를 관리할 수 있어</h2><p>자산 내역은 계정별로 분리되어 안전하게 저장돼.</p><button class="chip active" id="gateLogin">로그인 / 회원가입</button></div>
<main id="portfolioApp" hidden><div class="portfolio-summary"><div class="card hero-total"><div class="label">총 자산</div><div class="portfolio-total" id="totalValue">₩0</div><div class="mini" id="totalMeta">가격 불러오는 중</div></div><div class="card class-card"><canvas id="classChart"></canvas></div></div>
<div class="card portfolio-history"><div class="section-head"><div><h3 class="section-title">포트폴리오 변화</h3><div class="mini" id="historyChange">-</div></div><div class="period-tabs" id="historyTabs"><button class="chip active" data-period="day">일별</button><button class="chip" data-period="week">주별</button><button class="chip" data-period="month">월별</button></div></div><canvas id="historyChart"></canvas></div>
<div class="card"><div class="section-head"><h3 class="section-title">보유 자산</h3><button class="chip" id="refreshPortfolio">가격 새로고침</button></div><div class="class-filter" id="classFilter"><button class="chip active" data-class="all">전체</button><button class="chip" data-class="stock">주식</button><button class="chip" data-class="crypto">크립토</button><button class="chip" data-class="commodity">원자재</button><button class="chip" data-class="cash">현금</button></div><div class="table-wrap"><table><thead><tr><th>자산</th><th>자산군</th><th>수량</th><th>현재가</th><th>평가액</th><th>비중</th><th></th></tr></thead><tbody id="assetRows"></tbody></table></div></div></main></div>
<div class="modal-backdrop" id="portfolioAuthModal"><div class="modal"><div class="modal-head"><h3>로그인 / 회원가입</h3><button class="chip subtle" data-close="portfolioAuthModal" type="button">닫기</button></div><form class="modal-grid" id="portfolioAuthForm"><button class="chip google-auth" id="portfolioGoogleAuth" type="button"><span class="google-mark" aria-hidden="true">G</span>Google로 계속하기</button><div class="auth-divider"><span>또는</span></div><input class="field" id="portfolioEmail" type="email" autocomplete="email" placeholder="email@example.com"><input class="field" id="portfolioPassword" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)"><button class="chip active" id="portfolioLoginSubmit" type="submit">로그인</button><button class="chip" id="portfolioSignupSubmit" type="button">회원가입</button><div class="auth-status" id="portfolioAuthStatus">Google 또는 이메일로 로그인해.</div></form></div></div>
<div class="modal-backdrop" id="assetModal"><div class="modal asset-modal"><div class="modal-head"><h3>자산 추가</h3><button class="chip subtle" data-close="assetModal">닫기</button></div><div class="modal-grid"><label class="asset-form-label">자산 검색</label><input class="field" id="assetQuery" placeholder="BTC, 삼성전자, Gold…" autocomplete="off"><div class="asset-result-list" id="assetResults"></div><input type="hidden" id="selectedAsset"><label class="asset-form-label">수량</label><input class="field" id="assetQuantity" type="number" min="0" step="any" placeholder="0"><label class="asset-form-label manual-price" hidden>단가</label><input class="field manual-price" id="assetManualPrice" type="number" min="0" step="any" placeholder="단가" hidden><button class="chip active" id="saveAsset">저장</button><div class="auth-status" id="assetStatus">검색 결과에서 자산을 선택해.</div></div></div></div>
<script type="module" src="./js/my-assets.js?v=1"></script></body></html>
